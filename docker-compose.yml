services:
  db:
    image: postgis/postgis:16-3.4
    environment: { POSTGRES_USER: skillnet, POSTGRES_PASSWORD: skillnet, POSTGRES_DB: skillnet }
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
  app:
    build: .
    environment:
      DATABASE_URL: postgresql://skillnet:skillnet@db:5432/skillnet
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-}
    command: sh -c "python db/load_postgis.py && uvicorn backend.app.main:app --host 0.0.0.0 --port 8000"
    ports: ["8000:8000"]
    depends_on: [db]
volumes:
  pgdata:
